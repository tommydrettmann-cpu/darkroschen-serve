<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anmelden – Grün & Garten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --green-900:#173404; --green-800:#27500A; --green-700:#3B6D11;
      --green-600:#639922; --green-200:#C0DD97; --green-100:#EAF3DE;
      --amber-600:#BA7517; --amber-200:#FAC775;
      --gray-800:#2C2C2A; --gray-600:#5F5E5A; --gray-200:#D3D1C7;
      --white:#ffffff; --bg:#f5f8f0;
      --r-md:10px; --r-lg:14px; --r-xl:20px; --tr:0.22s ease;
    }
    body { font-family:'DM Sans',sans-serif; color:var(--gray-800); background:var(--bg); min-height:100vh; }

    .navbar { position:sticky; top:0; z-index:200; background:rgba(255,255,255,0.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--green-200); height:68px; display:flex; align-items:center; justify-content:space-between; padding:0 2.5rem; }
    .logo { font-family:'Playfair Display',serif; font-size:24px; font-weight:700; color:var(--green-800); text-decoration:none; }
    .logo em { color:var(--amber-600); font-style:normal; }
    .nbtn { font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; padding:9px 20px; border-radius:var(--r-md); cursor:pointer; border:1px solid var(--green-200); background:transparent; color:var(--green-800); transition:background var(--tr); text-decoration:none; display:inline-flex; align-items:center; gap:6px; }
    .nbtn:hover { background:var(--green-100); }

    .page-wrap { min-height:calc(100vh - 68px); display:flex; align-items:center; justify-content:center; padding:3rem 1.5rem; background:linear-gradient(150deg,#eef6e4 0%,#fdf9ee 55%,#f5f8f0 100%); position:relative; overflow:hidden; }
    .page-wrap::before { content:''; position:absolute; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle,var(--green-200),transparent 70%); opacity:0.2; top:-150px; right:-100px; pointer-events:none; }
    .page-wrap::after { content:''; position:absolute; width:350px; height:350px; border-radius:50%; background:radial-gradient(circle,var(--amber-200),transparent 70%); opacity:0.15; bottom:-100px; left:-80px; pointer-events:none; }

    .card { background:var(--white); border:1px solid var(--green-200); border-radius:var(--r-xl); padding:2.5rem 2rem; width:100%; max-width:420px; position:relative; z-index:1; box-shadow:0 4px 32px rgba(59,109,17,0.1); }
    .card-icon { width:56px; height:56px; border-radius:50%; background:var(--green-100); border:1px solid var(--green-200); display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--green-700); margin:0 auto 1rem; }
    .card-header { text-align:center; margin-bottom:2rem; }
    .card-header h1 { font-family:'Playfair Display',serif; font-size:1.7rem; font-weight:700; color:var(--green-800); margin-bottom:.4rem; }
    .card-header p { font-size:14px; color:var(--gray-600); }

    .form-group { margin-bottom:1.2rem; }
    .form-group label { display:block; font-size:13px; font-weight:500; color:var(--green-800); margin-bottom:6px; }
    .form-group input { width:100%; padding:11px 14px; border-radius:var(--r-md); border:1px solid var(--green-200); background:var(--bg); font-family:'DM Sans',sans-serif; font-size:14px; color:var(--gray-800); transition:border-color var(--tr),box-shadow var(--tr); outline:none; }
    .form-group input:focus { border-color:var(--green-600); box-shadow:0 0 0 3px rgba(99,153,34,0.12); }
    .pw-wrap { position:relative; }
    .pw-wrap input { padding-right:40px; }
    .pw-wrap i { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--gray-600); font-size:18px; cursor:pointer; }

    .forgot { text-align:right; margin-top:-6px; margin-bottom:1rem; }
    .forgot a { font-size:12px; color:var(--green-600); text-decoration:none; }
    .forgot a:hover { text-decoration:underline; }

    .btn-full { width:100%; padding:13px; border-radius:var(--r-lg); background:var(--green-700); color:#fff; border:none; font-family:'DM Sans',sans-serif; font-size:15px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; transition:background var(--tr),transform var(--tr); }
    .btn-full:hover { background:var(--green-800); transform:translateY(-1px); }
    .btn-full:disabled { background:var(--gray-200); cursor:not-allowed; transform:none; }

    .divider { display:flex; align-items:center; gap:12px; margin:1.5rem 0; }
    .divider span { font-size:12px; color:var(--gray-600); white-space:nowrap; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--green-200); }
    .register-hint { text-align:center; font-size:13px; color:var(--gray-600); }
    .register-hint a { color:var(--green-700); font-weight:500; text-decoration:none; }
    .register-hint a:hover { text-decoration:underline; }

    .msg { padding:10px 14px; border-radius:var(--r-md); font-size:13px; margin-bottom:1rem; display:none; line-height:1.6; }
    .msg.error   { background:#FEE2E2; color:#991B1B; border:1px solid #FECACA; display:block; }
    .msg.success { background:var(--green-100); color:var(--green-800); border:1px solid var(--green-200); display:block; }

    footer { background:var(--green-900); color:var(--green-200); padding:1.5rem; text-align:center; }
    .footer-logo { font-family:'Playfair Display',serif; font-size:18px; font-weight:700; color:#EAF3DE; }
    .footer-logo em { color:var(--amber-200); font-style:normal; }
    footer p { font-size:12px; opacity:0.6; margin-top:4px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">Grün<em>&</em>Garten</a>
  <a href="konto.html" class="nbtn"><i class="ti ti-user-plus"></i> Registrieren</a>
</nav>

<div class="page-wrap">
  <div class="card">
    <div class="card-header">
      <div class="card-icon"><i class="ti ti-login"></i></div>
      <h1>Willkommen zurück</h1>
      <p>Melde dich mit deinem Konto an</p>
    </div>

    <div class="msg" id="msg"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>E-Mail-Adresse</label>
        <input type="email" id="email" placeholder="deine@email.de" required />
      </div>
      <div class="form-group">
        <label>Passwort</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="••••••••" required />
          <i class="ti ti-eye" id="eyeIcon" onclick="togglePw()"></i>
        </div>
      </div>
      <div class="forgot"><a href="#">Passwort vergessen?</a></div>
      <button type="submit" class="btn-full" id="loginBtn">
        <i class="ti ti-login"></i> Anmelden
      </button>
    </form>

    <div class="divider"><span>Noch kein Konto?</span></div>
    <div class="register-hint">Jetzt kostenlos registrieren – <a href="konto.html">Konto erstellen</a></div>
  </div>
</div>

<footer>
  <div class="footer-logo">Grün<em>&</em>Garten</div>
  <p>Deine Gärtner-Vermittlung · Hannover</p>
</footer>

<script>
const SUPABASE_URL = 'https://zmryzkmumypvxpidpxcz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inptcnl6a211bXlwdnhwaWRweGN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjAzNDEwNDQsImV4cCI6MjA3NTkxNzA0NH0.bTvCv1x7TZMT0_XuJbHnWxGUizROrGmecF_EnASMX4s';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

function togglePw() {
  const inp = document.getElementById('password');
  const ico = document.getElementById('eyeIcon');
  inp.type = inp.type === 'password' ? 'text' : 'password';
  ico.className = inp.type === 'password' ? 'ti ti-eye' : 'ti ti-eye-off';
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.innerHTML = text;
  el.className = 'msg ' + type;
}

async function handleLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> Wird angemeldet...';

  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  // ── 1. Login bei Supabase ──
  const { data, error } = await sb.auth.signInWithPassword({ email, password });

  if (error) {
    let msg = '❌ Fehler beim Anmelden.';
    if (error.message.includes('Invalid login credentials'))
      msg = '❌ E-Mail oder Passwort ist falsch.';
    else if (error.message.includes('Email not confirmed'))
      msg = '📧 E-Mail noch nicht bestätigt – bitte Postfach prüfen.';
    else if (error.message.includes('too many'))
      msg = '⏳ Zu viele Versuche. Bitte kurz warten.';
    showMsg(msg, 'error');
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-login"></i> Anmelden';
    return;
  }

  // ── 2. E-Mail bestätigt? ──
  if (!data.user.email_confirmed_at) {
    showMsg('📧 E-Mail noch nicht bestätigt – bitte Postfach prüfen.', 'error');
    await sb.auth.signOut();
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-login"></i> Anmelden';
    return;
  }

  const userId = data.user.id;
  const meta   = data.user.user_metadata || {};

  // ── 3. Rolle bestimmen – mehrere Quellen prüfen ──
  let rolle = null;

  // Quelle A: Profil-Tabelle
  const { data: profil } = await sb
    .from('profile')
    .select('rolle')
    .eq('id', userId)
    .maybeSingle();

  if (profil?.rolle) {
    rolle = profil.rolle;
  }

  // Quelle B: Metadata (falls Profil noch nicht da)
  if (!rolle && meta.rolle) {
    rolle = meta.rolle;
  }

  // ── 4. Falls kein Profil → jetzt anlegen ──
  if (!profil) {
    rolle = rolle || 'kunde';

    function genNr(prefix) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let nr = prefix + '-';
      for (let i = 0; i < 6; i++) nr += chars[Math.floor(Math.random() * chars.length)];
      return nr;
    }

    try {
      await sb.from('profile').insert({
        id:           userId,
        rolle:        rolle,
        vorname:      meta.vorname      || '',
        nachname:     meta.nachname     || '',
        anzeigename:  meta.anzeigename  || '',
        plz:          meta.plz          || '',
        beschreibung: meta.beschreibung || '',
        kunden_nr:    rolle === 'kunde'    ? (meta.kunden_nr   || genNr('KD')) : null,
        gaertner_nr:  rolle === 'gaertner' ? (meta.gaertner_nr || genNr('GR')) : null,
      });

      // Zusatztabellen anlegen
      if (rolle === 'gaertner') {
        await sb.from('gaertner_profil')
          .upsert({ user_id: userId }, { onConflict: 'user_id', ignoreDuplicates: true });
      }
      if (rolle === 'kunde') {
        await sb.from('kunden_profil')
          .upsert({ user_id: userId, plz: meta.plz||'', ort:'' },
                  { onConflict: 'user_id', ignoreDuplicates: true });
      }
    } catch(err) {
      console.warn('Profil-Anlage Fehler (wird ignoriert):', err);
    }
  }

  // ── 5. Weiterleitung ──
  if (!rolle) {
    showMsg('❌ Rolle konnte nicht ermittelt werden. Bitte Support kontaktieren.', 'error');
    btn.disabled = false;
    btn.innerHTML = '<i class="ti ti-login"></i> Anmelden';
    return;
  }

  showMsg('✅ Anmeldung erfolgreich! Weiterleitung...', 'success');
  setTimeout(() => weiterleiten(rolle), 800);
}

function weiterleiten(rolle) {
  if (rolle === 'gaertner') window.location.href = 'gaertner-dashboard.html';
  else if (rolle === 'kunde') window.location.href = 'kunden-dashboard.html';
  else window.location.href = 'index.html';
}
</script>
</body>
</html>
