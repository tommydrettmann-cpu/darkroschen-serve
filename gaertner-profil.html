<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gärtner Profil – Grün & Garten</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --p-bg:#f5f8f0; --p-card:#ffffff; --p-header:#27500A;
      --p-accent:#BA7517; --p-text:#2C2C2A; --p-text2:#5F5E5A;
      --p-border:#C0DD97; --p-btn-bg:#3B6D11; --p-btn-text:#ffffff;
      --green-900:#173404; --green-800:#27500A; --green-700:#3B6D11;
      --green-600:#639922; --green-200:#C0DD97; --green-100:#EAF3DE;
      --amber-800:#633806; --amber-600:#BA7517; --amber-200:#FAC775; --amber-100:#FAEEDA;
      --gray-800:#2C2C2A; --gray-600:#5F5E5A; --gray-200:#D3D1C7;
      --white:#ffffff; --bg-page:#f5f8f0;
      --r-md:10px; --r-lg:14px; --r-xl:20px; --tr:0.22s ease;
    }
    body { font-family:'DM Sans',sans-serif; color:var(--p-text); background:var(--p-bg); min-height:100vh; }

    /* NAVBAR */
    .navbar { position:sticky; top:0; z-index:300; background:rgba(255,255,255,0.93); backdrop-filter:blur(12px); border-bottom:1px solid var(--green-200); height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 2rem; }
    .logo { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:var(--green-800); text-decoration:none; }
    .logo em { color:var(--amber-600); font-style:normal; }
    .nav-right { display:flex; align-items:center; gap:8px; }
    .nbtn { font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; padding:8px 16px; border-radius:var(--r-md); cursor:pointer; border:1px solid var(--green-200); background:transparent; color:var(--green-800); transition:all var(--tr); text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
    .nbtn:hover { background:var(--green-100); }
    .nbtn.primary { background:var(--green-700); color:#fff; border-color:var(--green-700); }

    /* EDITOR TOOLBAR */
    .editor-toolbar { background:var(--green-900); color:#fff; padding:10px 2rem; display:none; align-items:center; gap:10px; flex-wrap:wrap; position:sticky; top:64px; z-index:299; }
    .editor-toolbar.visible { display:flex; }
    .tb-btn { font-size:12px; font-weight:500; padding:6px 12px; border-radius:8px; cursor:pointer; border:1px solid rgba(255,255,255,0.2); background:rgba(255,255,255,0.1); color:#fff; font-family:'DM Sans',sans-serif; display:inline-flex; align-items:center; gap:5px; transition:background var(--tr); }
    .tb-btn:hover { background:rgba(255,255,255,0.2); }
    .tb-btn.active { background:var(--green-700); border-color:var(--green-600); }
    .tb-sep { width:1px; height:20px; background:rgba(255,255,255,0.2); }

    /* STATUS BADGE */
    .status-badge { display:inline-flex; align-items:center; gap:5px; font-size:12px; padding:4px 12px; border-radius:20px; font-weight:500; cursor:pointer; transition:all var(--tr); border:1px solid transparent; }
    .status-badge.online { background:#DCFCE7; color:#166534; border-color:#A7F3D0; }
    .status-badge.offline { background:var(--gray-200); color:var(--gray-600); border-color:var(--gray-200); }
    .status-badge .dot { width:8px; height:8px; border-radius:50%; }
    .status-badge.online .dot { background:#16A34A; }
    .status-badge.offline .dot { background:var(--gray-600); }

    /* PROFIL HEADER */
    .profil-header { background:var(--p-header); padding:3rem 2rem 2rem; position:relative; overflow:hidden; }
    .profil-header::before { content:''; position:absolute; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,0.07),transparent 70%); top:-150px; right:-80px; pointer-events:none; }
    .ph-inner { max-width:900px; margin:0 auto; display:flex; align-items:flex-end; gap:2rem; flex-wrap:wrap; position:relative; z-index:1; }
    .avatar { width:100px; height:100px; border-radius:50%; background:rgba(255,255,255,0.15); border:4px solid rgba(255,255,255,0.4); display:flex; align-items:center; justify-content:center; font-size:36px; color:rgba(255,255,255,0.7); overflow:hidden; cursor:pointer; position:relative; flex-shrink:0; }
    .avatar img { width:100%; height:100%; object-fit:cover; display:none; }
    .avatar-overlay { position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity var(--tr); color:#fff; font-size:20px; }
    .avatar:hover .avatar-overlay { opacity:1; }
    .ph-info { flex:1; min-width:200px; }
    .ph-name { font-family:'Playfair Display',serif; font-size:clamp(1.5rem,4vw,2rem); font-weight:700; color:#fff; margin-bottom:3px; }
    .ph-realname { font-size:13px; color:rgba(255,255,255,0.65); margin-bottom:8px; }
    .ph-badges { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .ph-badge { display:inline-flex; align-items:center; gap:5px; font-size:12px; color:rgba(255,255,255,0.85); background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); padding:4px 10px; border-radius:20px; }
    .ph-nr { font-family:'Courier New',monospace; font-weight:700; letter-spacing:1px; }
    .ph-actions { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

    /* BODY */
    .profil-body { max-width:900px; margin:0 auto; padding:1.5rem 2rem 3rem; }
    .blocks-container { display:grid; gap:16px; }
    .layout-1 { grid-template-columns:1fr 1fr; }
    .layout-2 { grid-template-columns:2fr 1fr; }
    .layout-3 { grid-template-columns:1fr 2fr; }
    .layout-4 { grid-template-columns:1fr; }

    /* BLÖCKE */
    .block { background:var(--p-card); border:1px solid var(--p-border); border-radius:var(--r-xl); padding:1.5rem; position:relative; transition:box-shadow var(--tr); }
    .block.dragging { opacity:0.4; }
    .block.drag-over { border:2px dashed var(--green-600); background:var(--green-100); }
    .block.hidden-block { opacity:0.35; filter:grayscale(0.5); position:relative; }
    .block.hidden-block::after { content:'Ausgeblendet'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--gray-600); background:rgba(255,255,255,0.6); border-radius:var(--r-xl); pointer-events:none; }
    .block.hidden-block .drag-handle, .block.hidden-block .block-toggle-btn { pointer-events:all; z-index:10; position:relative; }
    .drag-handle { position:absolute; top:10px; left:10px; width:24px; height:24px; border-radius:6px; background:var(--green-100); color:var(--green-600); display:none; align-items:center; justify-content:center; font-size:14px; cursor:grab; z-index:10; }
    .edit-mode .drag-handle { display:flex; }
    .edit-mode .block { cursor:default; padding-left:2.5rem; }

    .block-title { font-size:13px; font-weight:500; color:var(--p-text); display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; padding-bottom:8px; border-bottom:1px solid var(--p-border); }
    .bt-left { display:flex; align-items:center; gap:7px; }
    .bt-left i { font-size:16px; color:var(--p-accent); }
    .bt-right { display:flex; align-items:center; gap:6px; }
    .block-edit-btn { font-size:11px; color:var(--p-accent); cursor:pointer; display:none; align-items:center; gap:3px; background:none; border:none; font-family:'DM Sans',sans-serif; padding:3px 8px; border-radius:6px; transition:background var(--tr); }
    .edit-mode .block-edit-btn { display:flex; }
    .block-toggle-btn { font-size:11px; color:var(--gray-600); cursor:pointer; display:none; align-items:center; gap:3px; background:none; border:1px solid var(--gray-200); font-family:'DM Sans',sans-serif; padding:3px 8px; border-radius:6px; transition:all var(--tr); }
    .edit-mode .block-toggle-btn { display:flex; }
    .block-toggle-btn.hidden { color:var(--gray-400,#9CA3AF); border-color:var(--gray-200); text-decoration:line-through; }

    /* INHALTE */
    .beschreibung-text { font-size:14px; color:var(--p-text2); line-height:1.75; }
    .tags-wrap { display:flex; flex-wrap:wrap; gap:7px; }
    .tag { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:20px; font-size:12px; background:var(--p-bg); color:var(--p-text); border:1px solid var(--p-border); }
    .tag i { font-size:13px; color:var(--p-accent); }
    .tag.jahreszeit { font-weight:500; padding:6px 14px; }
    .tag.fruehling { background:#ECFDF5; border-color:#A7F3D0; color:#065F46; }
    .tag.fruehling i { color:#10B981; }
    .tag.sommer { background:#FFFBEB; border-color:#FDE68A; color:#92400E; }
    .tag.sommer i { color:#F59E0B; }
    .tag.herbst { background:#FFF7ED; border-color:#FED7AA; color:#9A3412; }
    .tag.herbst i { color:#EA580C; }
    .tag.winter { background:#EFF6FF; border-color:#BFDBFE; color:#1E40AF; }
    .tag.winter i { color:#3B82F6; }

    /* VERFÜGBARKEIT */
    .verfueg-grid { display:flex; flex-wrap:wrap; gap:8px; }
    .verfueg-tag { padding:6px 12px; border-radius:20px; font-size:12px; border:1px solid var(--p-border); background:var(--p-bg); color:var(--p-text2); display:flex; align-items:center; gap:5px; }
    .verfueg-tag.aktiv { background:var(--p-btn-bg); color:var(--p-btn-text); border-color:var(--p-btn-bg); }

    /* ERFAHRUNG */
    .erfahrung-list { list-style:none; }
    .erfahrung-list li { font-size:13px; color:var(--p-text2); padding:7px 0; border-bottom:1px solid var(--p-border); display:flex; align-items:flex-start; gap:8px; line-height:1.6; }
    .erfahrung-list li:last-child { border-bottom:none; }
    .erfahrung-list li i { font-size:15px; color:var(--p-accent); flex-shrink:0; margin-top:2px; }

    /* WERKZEUG */
    .werkzeug-liste { display:flex; flex-wrap:wrap; gap:7px; }
    .werkzeug-tag { display:inline-flex; align-items:center; gap:5px; padding:5px 12px; border-radius:20px; font-size:12px; background:#EFF6FF; color:#1E40AF; border:1px solid #BFDBFE; }
    .werkzeug-tag i { font-size:13px; }

    /* ANGEBOTE */
    .auftraege-liste { display:flex; flex-direction:column; gap:10px; }
    .auftrag-card { background:var(--p-bg); border:1px solid var(--p-border); border-radius:var(--r-lg); padding:1rem; cursor:pointer; transition:all var(--tr); }
    .auftrag-card:hover { border-color:var(--p-accent); transform:translateY(-1px); }
    .auftrag-card.angenommen { border-color:#16A34A; background:#DCFCE7; }
    .ac-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:5px; }
    .ac-name { font-size:14px; font-weight:500; color:var(--p-text); }
    .ac-preis { font-size:13px; font-weight:500; color:var(--p-accent); white-space:nowrap; }
    .ac-meta { display:flex; gap:12px; flex-wrap:wrap; font-size:11px; color:var(--p-text2); margin-bottom:8px; }
    .ac-meta span { display:flex; align-items:center; gap:4px; }
    .ac-status { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:500; padding:3px 8px; border-radius:10px; }
    .ac-status.offen { background:#DCFCE7; color:#166534; }
    .ac-status.angenommen { background:#D1FAE5; color:#065F46; }
    .anfragen-btn { width:100%; padding:10px; border-radius:var(--r-md); background:var(--p-btn-bg); color:var(--p-btn-text); border:none; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition:all var(--tr); margin-top:10px; }
    .anfragen-btn:hover { opacity:0.88; transform:translateY(-1px); }

    /* KUNDEN AUFTRÄGE */
    .kunden-auftrag-item { background:var(--p-bg); border:1px solid var(--p-border); border-radius:var(--r-lg); padding:1rem; margin-bottom:10px; }
    .ka-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px; }
    .ka-titel { font-size:13px; font-weight:500; color:var(--p-text); }
    .ka-meta { font-size:12px; color:var(--p-text2); display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
    .ka-meta span { display:flex; align-items:center; gap:4px; }
    .ka-tags { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:8px; }
    .ka-tag { font-size:11px; padding:2px 7px; border-radius:10px; background:var(--amber-100); color:var(--amber-800); border:1px solid var(--amber-200); }
    .ka-btn { font-size:12px; font-weight:500; padding:6px 12px; border-radius:8px; cursor:pointer; border:none; font-family:'DM Sans',sans-serif; display:inline-flex; align-items:center; gap:5px; transition:all var(--tr); background:var(--p-btn-bg); color:var(--p-btn-text); }
    .ka-btn:hover { opacity:0.85; }

    /* KONTAKT */
    .kontakt-block { display:flex; flex-direction:column; gap:10px; }
    .kontakt-btn { width:100%; padding:11px; border-radius:var(--r-lg); font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:7px; transition:all var(--tr); border:none; }
    .kontakt-btn.primary { background:var(--p-btn-bg); color:var(--p-btn-text); }
    .kontakt-btn.primary:hover { opacity:0.88; transform:translateY(-1px); }
    .kontakt-btn.secondary { background:var(--p-card); color:var(--p-text); border:1px solid var(--p-border); }
    .kontakt-btn.secondary:hover { background:var(--p-bg); }
    .sicher-hinweis { font-size:11px; color:var(--p-text2); text-align:center; line-height:1.5; }

    .leer { font-size:13px; color:var(--p-text2); font-style:italic; padding:0.5rem 0; }

    /* AKTIONS-BUTTONS */
    .aktions-wrap { max-width:900px; margin:0 auto; padding:0 2rem 2rem; display:none; }
    .aktions-wrap.visible { display:block; }
    .aktions-inner { display:flex; gap:12px; flex-wrap:wrap; }
    .aktions-btn { font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; padding:12px 24px; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:all 0.2s ease; border:2px solid transparent; }
    .aktions-btn.form-rund { border-radius:50px; }
    .aktions-btn.form-eckig { border-radius:4px; }
    .aktions-btn.form-mittel { border-radius:12px; }
    .aktions-btn.stil-outline { background:transparent !important; border-color:currentColor; }
    .aktions-btn.stil-ghost { background:transparent !important; border-color:transparent; text-decoration:underline; }
    .btn-anpass-panel { background:var(--p-card); border:1px solid var(--p-border); border-radius:var(--r-xl); padding:1.5rem; margin-bottom:16px; display:none; }
    .edit-mode .btn-anpass-panel { display:block; }
    .btn-anpass-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .bap-item { display:flex; flex-direction:column; gap:5px; }
    .bap-item label { font-size:12px; font-weight:500; color:var(--p-text2); }
    .bap-select { font-size:12px; padding:6px 10px; border-radius:8px; border:1px solid var(--p-border); background:var(--p-bg); font-family:'DM Sans',sans-serif; color:var(--p-text); cursor:pointer; }
    .bap-color { height:36px; border-radius:8px; border:1px solid var(--p-border); cursor:pointer; padding:2px; width:100%; }

    /* MODALS */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:600; display:none; align-items:center; justify-content:center; padding:1rem; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--white); border-radius:var(--r-xl); padding:1.75rem; width:100%; max-width:560px; max-height:90vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
    .modal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.4rem; }
    .modal-header h3 { font-family:'Playfair Display',serif; font-size:1.25rem; font-weight:700; color:var(--green-800); }
    .modal-close { background:none; border:none; font-size:20px; cursor:pointer; color:var(--gray-600); padding:4px; border-radius:6px; }
    .fg { margin-bottom:1rem; }
    .fg label { display:block; font-size:13px; font-weight:500; color:var(--green-800); margin-bottom:5px; }
    .fg input, .fg textarea, .fg select { width:100%; padding:10px 13px; border-radius:var(--r-md); border:1px solid var(--green-200); background:var(--bg-page); font-family:'DM Sans',sans-serif; font-size:14px; color:var(--gray-800); outline:none; appearance:none; transition:border-color var(--tr); }
    .fg textarea { resize:vertical; min-height:75px; line-height:1.6; }
    .fg input:focus, .fg textarea:focus, .fg select:focus { border-color:var(--green-600); box-shadow:0 0 0 3px rgba(99,153,34,0.12); }
    .fg .hint { font-size:11px; color:var(--gray-600); margin-top:4px; }
    .fg-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .modal-footer { display:flex; gap:10px; margin-top:1.4rem; }
    .btn-save { flex:1; padding:11px; border-radius:var(--r-lg); background:var(--green-700); color:#fff; border:none; font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition:all var(--tr); }
    .btn-save:hover { background:var(--green-800); }
    .btn-cancel { padding:11px 18px; border-radius:var(--r-lg); background:transparent; color:var(--gray-600); border:1px solid var(--gray-200); font-family:'DM Sans',sans-serif; font-size:14px; cursor:pointer; }
    .btn-cancel:hover { background:var(--bg-page); }
    .modal-delete { padding:8px 14px; border-radius:var(--r-md); font-size:13px; background:#FEE2E2; color:#991B1B; border:1px solid #FECACA; cursor:pointer; font-family:'DM Sans',sans-serif; display:flex; align-items:center; gap:5px; }

    /* MODAL SPEZIAL */
    .js-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:1.2rem; }
    .js-btn { padding:12px; border-radius:var(--r-lg); border:2px solid transparent; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; display:flex; align-items:center; gap:8px; transition:all var(--tr); }
    .js-btn.fruehling { background:#ECFDF5; color:#065F46; border-color:#A7F3D0; }
    .js-btn.sommer { background:#FFFBEB; color:#92400E; border-color:#FDE68A; }
    .js-btn.herbst { background:#FFF7ED; color:#9A3412; border-color:#FED7AA; }
    .js-btn.winter { background:#EFF6FF; color:#1E40AF; border-color:#BFDBFE; }
    .js-btn.selected { filter:brightness(0.88); box-shadow:0 0 0 3px rgba(59,109,17,0.15); }
    .taetigkeit-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; }
    .taetigkeit-tag { padding:8px 10px; border-radius:var(--r-md); border:1px solid var(--green-200); background:var(--bg-page); font-size:12px; color:var(--gray-800); cursor:pointer; display:flex; align-items:center; gap:5px; transition:all var(--tr); user-select:none; }
    .taetigkeit-tag i { font-size:13px; color:var(--green-600); }
    .taetigkeit-tag.selected { background:var(--green-100); border-color:var(--green-600); font-weight:500; }
    .verfueg-sel-grid { display:flex; flex-wrap:wrap; gap:8px; }
    .vs-btn { padding:8px 14px; border-radius:20px; font-size:13px; border:1px solid var(--green-200); background:var(--bg-page); color:var(--gray-800); cursor:pointer; font-family:'DM Sans',sans-serif; display:flex; align-items:center; gap:5px; transition:all var(--tr); user-select:none; }
    .vs-btn.selected { background:var(--green-700); color:#fff; border-color:var(--green-700); }
    .werkzeug-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; }
    .wz-tag { padding:8px 10px; border-radius:var(--r-md); border:1px solid #BFDBFE; background:#EFF6FF; font-size:12px; color:#1E40AF; cursor:pointer; display:flex; align-items:center; gap:5px; transition:all var(--tr); user-select:none; }
    .wz-tag.selected { background:#2563EB; color:#fff; border-color:#2563EB; }
    .farben-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .farbe-item { display:flex; flex-direction:column; gap:5px; }
    .farbe-item label { font-size:12px; font-weight:500; color:var(--gray-800); }
    .farbe-item input[type="color"] { width:100%; height:40px; border-radius:var(--r-md); border:1px solid var(--green-200); cursor:pointer; padding:3px; background:var(--bg-page); }
    .farben-vorlagen { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:1rem; }
    .fv { width:32px; height:32px; border-radius:50%; cursor:pointer; border:3px solid transparent; transition:all var(--tr); }
    .fv:hover { transform:scale(1.15); }
    .fv.active { border-color:var(--green-800); }
    .layout-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }

    /* WARN BOX */

    .toast.show { transform:translateY(0); opacity:1; }
    .spinner-wrap { min-height:60vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; }
    .spinner { width:36px; height:36px; border-radius:50%; border:3px solid var(--green-200); border-top-color:var(--green-700); animation:spin 0.8s linear infinite; }

    footer { background:var(--green-900); color:var(--green-200); padding:1.5rem; text-align:center; margin-top:2rem; }
    .footer-logo { font-family:'Playfair Display',serif; font-size:18px; font-weight:700; color:var(--green-100); }
    .footer-logo em { color:var(--amber-200); font-style:normal; }
    footer p { font-size:12px; opacity:0.6; margin-top:4px; }


    /* KUNDEN-PROFIL ITEMS */
    .kunden-profil-item {
      display:flex; align-items:center; gap:10px; padding:10px;

      border-radius:var(--r-lg); margin-bottom:8px; cursor:pointer;
      transition:all var(--tr);
    }
    .kunden-profil-item:hover { border-color:var(--p-accent); transform:translateX(2px); }
    .kunden-profil-item:last-child { margin-bottom:0; }
    .kpi-avatar {
      width:40px; height:40px; border-radius:50%; flex-shrink:0;
      background:var(--amber-100); border:2px solid var(--amber-200);
      display:flex; align-items:center; justify-content:center;
      font-size:18px; color:var(--amber-600); overflow:hidden;
    }
    .kpi-info { flex:1; min-width:0; }
    .kpi-name { font-size:13px; font-weight:500; color:var(--p-text); margin-bottom:2px; }
    .kpi-ort { font-size:11px; color:var(--p-text2); display:flex; align-items:center; gap:4px; margin-bottom:2px; }
    .kpi-desc { font-size:11px; color:var(--p-text2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inptcnl6a211bXlwdnhwaWRweGN6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjAzNDEwNDQsImV4cCI6MjA3NTkxNzA0NH0.bTvCv1x7TZMT0_XuJbHnWxGUizROrGmecF_EnASMX4s';
const { createClient } = supabase;

let currentUser=null, profil=null, gaertnerProfil=null, isOwner=false, editMode=false, dragMode=false;
let auftraege=[], kundenAuftraege=[], kundenProfile=[], blockOrder=['beschreibung','jahreszeiten','taetigkeiten','verfuegbarkeit','werkzeug','erfahrung','ausbildung','auftraege','kunden-profile','kunden-auftraege','kontakt'];

let btnEinstellungen={ form:'form-rund', stil:'stil-gefuellt', groesse:'14px', c1:'#DC2626', c2:'#16A34A', c3:'#2563EB' };
let isOnline = true;

const urlParams = new URLSearchParams(window.location.search);
const profilId = urlParams.get('id');

const JAHRESZEITEN_TAETIGKEITEN = {
  fruehling: [{icon:'ti-scissors',label:'Rasenmähen'},{icon:'ti-plant',label:'Pflanzen einsetzen'},{icon:'ti-leaf',label:'Unkraut entfernen'},{icon:'ti-shovel',label:'Umgraben / Harken'},{icon:'ti-building',label:'Beete anlegen'},{icon:'ti-droplet',label:'Düngen'}],

};
const WOCHENTAGE = [{key:'mo',label:'Mo'},{key:'di',label:'Di'},{key:'mi',label:'Mi'},{key:'do',label:'Do'},{key:'fr',label:'Fr'},{key:'sa',label:'Sa'},{key:'so',label:'So'}];

const FARBEN_VORLAGEN = [

  {name:'Lavendel',bg:'#F5F3FF',card:'#ffffff',header:'#4C1D95',accent:'#7C3AED',text:'#1E1B4B',text2:'#6B7280',border:'#DDD6FE',btnBg:'#6D28D9',btnText:'#ffffff'},
];

// ── INIT ──
async function init() {
  const {data:{session}} = await sb.auth.getSession();
  currentUser = session?.user || null;
  const zielId = profilId || currentUser?.id;
  if (!zielId) { window.location.href='anmelden.html'; return; }

  const {data,error} = await sb.from('profile').select('*').eq('id',zielId).single();
  if (error || !data || data.rolle !== 'gaertner') {
    document.getElementById('spinnerWrap').innerHTML='<p style="color:var(--gray-600);padding:3rem;text-align:center">Profil nicht gefunden.</p>';
    return;
  }
  profil = data;
  isOwner = currentUser?.id === zielId;

  const {data:gd} = await sb.from('gaertner_profil').select('*').eq('user_id',zielId).single();
  gaertnerProfil = gd || {};

  const {data:ad} = await sb.from('gaertner_auftraege').select('*').eq('gaertner_id',zielId).order('erstellt_am',{ascending:false});
  auftraege = ad || [];

  // Kunden-Aufträge laden (nur für Besitzer)
  if (isOwner) {
    try {
      const {data:kd, error:kdErr} = await sb.from('kunden_auftraege')
        .select('*')
        .eq('status','offen')
        .order('erstellt_am',{ascending:false})
        .limit(20);
      if (!kdErr) kundenAuftraege = kd || [];
      else console.warn('Kunden-Aufträge Fehler:', kdErr.message);
    } catch(e) { console.warn('Kunden-Aufträge Ladefehler:', e); }
  }

  // Kunden-Profile laden (für Gärtner sichtbar – nur sichere Felder)
  if (isOwner) {
    try {
      const {data:kp, error:kpErr} = await sb.from('profile')
        .select('id,anzeigename,vorname,nachname,plz,beschreibung,avatar_url,kunden_nr,stadtteil')
        .eq('rolle','kunde')
        .order('erstellt_am',{ascending:false})
        .limit(12);
      if (!kpErr) kundenProfile = kp || [];
      else console.warn('Kunden-Profile Fehler:', kpErr.message);
    } catch(e) { console.warn('Kunden-Profile Ladefehler:', e); }
  }

  // Einstellungen laden
  if (gaertnerProfil.profil_einstellungen) {
    try {
      const e = JSON.parse(gaertnerProfil.profil_einstellungen);
      if (e.farben) farben={...farben,...e.farben};
      if (e.blockOrder) {
        // Neue Blöcke die noch nicht in gespeicherter Order sind, hinzufügen
        const defaultOrder = ['beschreibung','jahreszeiten','taetigkeiten','verfuegbarkeit','werkzeug','erfahrung','ausbildung','auftraege','kunden-profile','kunden-auftraege','kontakt'];
        const saved = e.blockOrder;
        const missing = defaultOrder.filter(b => !saved.includes(b));
        blockOrder = [...saved, ...missing];
      }
      if (e.layout) currentLayout=e.layout;
      if (e.btnEinstellungen) btnEinstellungen={...btnEinstellungen,...e.btnEinstellungen};
      if (e.hiddenBlocks) hiddenBlocks=new Set(e.hiddenBlocks);
      if (typeof e.isOnline === 'boolean') isOnline=e.isOnline;
    } catch(_){}
  }

  applyFarben();
  renderProfil();
}

function applyFarben() {
  const r = document.documentElement;
  r.style.setProperty('--p-bg',farben.bg); r.style.setProperty('--p-card',farben.card);
  r.style.setProperty('--p-header',farben.header); r.style.setProperty('--p-accent',farben.accent);
  r.style.setProperty('--p-text',farben.text); r.style.setProperty('--p-text2',farben.text2);
  r.style.setProperty('--p-border',farben.border); r.style.setProperty('--p-btn-bg',farben.btnBg);
  r.style.setProperty('--p-btn-text',farben.btnText);
}

function renderProfil() {
  // Header
  document.getElementById('displayName').textContent = profil.anzeigename || 'Kein Anzeigename';
  document.getElementById('displayRealname').textContent = ((profil.vorname||'')+' '+(profil.nachname||'')).trim() || '–';
  document.getElementById('displayPlz').textContent = profil.plz || '–';
  // Gärtner-Nummer
  const nr = profil.gaertner_nr || profil.kunden_nr || ('GR-'+profil.id.slice(0,6).toUpperCase());
  document.getElementById('displayNr').textContent = nr;
  if (profil.avatar_url) {
    document.getElementById('avatarImg').src = profil.avatar_url;
    document.getElementById('avatarImg').style.display='block';
    document.getElementById('avatarIcon').style.display='none';
  }

  if (isOwner) {
    document.getElementById('navRight').innerHTML = `
      <span style="font-size:12px;color:var(--gray-600)">Hallo ${profil.vorname||'Gärtner'}</span>
      <button class="nbtn" onclick="toggleEditMode()"><i class="ti ti-edit"></i> Bearbeiten</button>
      <button class="nbtn" onclick="abmelden()" style="color:#991B1B;border-color:#FECACA"><i class="ti ti-logout"></i></button>
    `;
    document.getElementById('headerAktionen').style.display='block';
    document.getElementById('aktionsWrap').classList.add('visible');
    const sb_el = document.getElementById('statusBadge');
    sb_el.style.display='inline-flex';
    updateStatusBadge();
    setTimeout(updateButtons,100);
  } else {
    // Besucher-Navbar
    if (currentUser) {
      document.getElementById('navRight').innerHTML = `
        <a href="kunden-dashboard.html" class="nbtn"><i class="ti ti-arrow-left"></i> Mein Bereich</a>
      `;
    } else {
      document.getElementById('navRight').innerHTML = `
        <a href="anmelden.html" class="nbtn primary"><i class="ti ti-login"></i> Anmelden</a>
      `;
    }
  }

  const container = document.getElementById('blocksContainer');
  container.className = 'blocks-container ' + currentLayout;
  container.innerHTML = '';
  blockOrder.forEach(id => {
    const el = createBlock(id);
    if (el) container.appendChild(el);
  });

  document.getElementById('spinnerWrap').style.display='none';
  document.getElementById('profilWrap').style.display='block';
}

// ── STATUS ──
function updateStatusBadge() {
  const badge = document.getElementById('statusBadge');
  const text = document.getElementById('statusText');
  badge.className = 'status-badge ' + (isOnline ? 'online' : 'offline');
  text.textContent = isOnline ? 'Online & Öffentlich' : 'Offline / Versteckt';
}

async function toggleStatus() {
  if (!isOwner) return;
  isOnline = !isOnline;
  updateStatusBadge();
  await speichereEinstellungen();
  showToast(isOnline ? '✅ Du bist jetzt öffentlich sichtbar' : '🔒 Du bist jetzt offline/versteckt');
}

// ── BLOCKS ──
function createBlock(id) {
  const isHidden = hiddenBlocks.has(id);
  // Besucher sehen ausgeblendete Blöcke gar nicht
  if (isHidden && !isOwner) return null;
  const block = document.createElement('div');
  block.className = 'block' + (isHidden ? ' hidden-block' : '');
  block.dataset.blockId = id;
  block.draggable = false;

  const handle = document.createElement('div');
  handle.className = 'drag-handle';
  handle.innerHTML = '<i class="ti ti-grip-vertical"></i>';
  block.appendChild(handle);
  handle.addEventListener('mousedown', () => block.draggable = true);
  block.addEventListener('dragstart', onDragStart);
  block.addEventListener('dragover', onDragOver);
  block.addEventListener('dragleave', onDragLeave);
  block.addEventListener('drop', onDrop);
  block.addEventListener('dragend', () => { block.draggable=false; block.classList.remove('dragging'); });

  let inner = '';
  const toggleBtn = `<button class="block-toggle-btn ${isHidden?'hidden':''}" onclick="toggleBlock('${id}',this)" title="${isHidden?'Einblenden':'Ausblenden'}"><i class="ti ${isHidden?'ti-eye':'ti-eye-off'}"></i>${isHidden?'Einblenden':'Ausblenden'}</button>`;

  if (id === 'beschreibung') {
    inner = `<div class="block-title"><div class="bt-left"><i class="ti ti-user-circle"></i> Über mich</div><div class="bt-right">${toggleBtn}<button class="block-edit-btn" onclick="openModal('beschreibung')"><i class="ti ti-pencil"></i> Bearbeiten</button></div></div>
    <div class="warn-box" style="margin-bottom:12px"><i class="ti ti-alert-triangle"></i><p><strong>Wichtig:</strong> E-Mail & Telefonnummern sind verboten. Verstöße → Konto-Sperrung.</p></div>
    <p class="beschreibung-text">${profil.beschreibung || '<span style="font-style:italic;color:var(--p-text2)">Noch keine Beschreibung.</span>'}</p>`;
  }
  else if (id === 'jahreszeiten') {

// ── BLOCK TOGGLE (Einblenden/Ausblenden) ──
function toggleBlock(id, btn) {
  const block = document.querySelector(`.block[data-block-id="${id}"]`);
  if (!block) return;
  if (hiddenBlocks.has(id)) {
    hiddenBlocks.delete(id);
    block.classList.remove('hidden-block');
    btn.innerHTML = '<i class="ti ti-eye-off"></i>Ausblenden';
    btn.classList.remove('hidden');
  } else {
    hiddenBlocks.add(id);
    block.classList.add('hidden-block');
    btn.innerHTML = '<i class="ti ti-eye"></i>Einblenden';
    btn.classList.add('hidden');
  }
  showToast(hiddenBlocks.has(id) ? 'Block ausgeblendet' : 'Block eingeblendet');
}

// ── DRAG & DROP ──
let dragSrc = null;
function toggleDragMode() {
  dragMode = !dragMode;
  document.getElementById('toggleDragBtn').classList.toggle('active',dragMode);
  document.querySelectorAll('.block').forEach(b => b.style.cursor = dragMode?'grab':'default');
  showToast(dragMode ? '↕️ Verschieben aktiv' : '✅ Drag-Modus aus');
}
function onDragStart(e) { if(!dragMode){e.preventDefault();return;} dragSrc=this; this.classList.add('dragging'); }
function onDragOver(e) { if(!dragMode)return; e.preventDefault(); this.classList.add('drag-over'); }
function onDragLeave() { this.classList.remove('drag-over'); }
function onDrop(e) {
  if(!dragMode||dragSrc===this)return;
  e.preventDefault(); this.classList.remove('drag-over');
  const c=document.getElementById('blocksContainer'), ch=[...c.children];
  const si=ch.indexOf(dragSrc), ti=ch.indexOf(this);
  if(si<ti) c.insertBefore(dragSrc,this.nextSibling); else c.insertBefore(dragSrc,this);
  blockOrder = [...c.children].map(b=>b.dataset.blockId);
}

function toggleEditMode() {
  editMode = !editMode;
  document.getElementById('editorToolbar').classList.toggle('visible',editMode);
  document.body.classList.toggle('edit-mode',editMode);
  document.querySelector('.nbtn[onclick="toggleEditMode()"]').innerHTML = editMode
    ? '<i class="ti ti-eye"></i> Vorschau'
    : '<i class="ti ti-edit"></i> Bearbeiten';
}

function toggleJS(el,js) {

function updateTaetigkeitenGrid(aktiveJS,aktiveTaet) {
  const grid=document.getElementById('modalTaetigkeitenGrid'); if(!grid)return;
  const alle=new Map();
  aktiveJS.forEach(js=>(JAHRESZEITEN_TAETIGKEITEN[js]||[]).forEach(t=>alle.set(t.label,t)));
  if(alle.size===0){grid.innerHTML='<p style="font-size:13px;color:var(--gray-600);grid-column:1/-1">Zuerst Jahreszeiten wählen.</p>';return;}
  grid.innerHTML=[...alle.values()].map(t=>`<div class="taetigkeit-tag ${aktiveTaet.has(t.label)?'selected':''}" data-label="${t.label}" onclick="this.classList.toggle('selected')"><i class="ti ${t.icon}"></i>${t.label}</div>`).join('');
}
function selectLayout(id,el) {
  document.querySelectorAll('.layout-opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected'); currentLayout=id;
  document.getElementById('blocksContainer').className='blocks-container '+id;
}
function applyVorlage(i) {
  farben={...FARBEN_VORLAGEN[i]}; applyFarben();
  document.querySelectorAll('.fv').forEach((v,vi)=>v.classList.toggle('active',vi===i));
  ['bg','card','header','accent','text','text2','border','btnBg','btnText'].forEach(k=>{const el=document.getElementById('f_'+k);if(el)el.value=farben[k];});
}

// ── SPEICHERN ──
async function saveBasis() {
  const an=document.getElementById('m_an').value.trim(), plz=document.getElementById('m_plz').value.trim();
  await sb.from('profile').update({anzeigename:an,plz}).eq('id',currentUser.id);
  profil.anzeigename=an; profil.plz=plz;
  document.getElementById('displayName').textContent=an;
  document.getElementById('displayPlz').textContent=plz;
  closeModal(); showToast('Profil gespeichert ✅'); renderProfil();
}
async function saveDesc() {
  const d=document.getElementById('m_desc').value.trim();
  // Email/Telefon prüfen
  if(/[\d]{5,}|@|\+49/.test(d)){showToast('❌ Keine Telefonnummern oder E-Mails erlaubt!');return;}
  await sb.from('profile').update({beschreibung:d}).eq('id',currentUser.id);
  profil.beschreibung=d; closeModal(); showToast('Beschreibung gespeichert ✅'); renderProfil();
}
async function saveTaetigkeiten() {
  const js=[...document.querySelectorAll('.js-btn.selected')].map(b=>b.classList[1]);
  const t=[...document.querySelectorAll('#modalTaetigkeitenGrid .taetigkeit-tag.selected')].map(b=>b.dataset.label);
  await upsertGaertnerProfil({jahreszeiten:js,taetigkeiten:t});
  gaertnerProfil.jahreszeiten=js; gaertnerProfil.taetigkeiten=t;
  closeModal(); showToast('Tätigkeiten gespeichert ✅'); renderProfil();
}
async function saveVerfuegbarkeit() {
  const v=[...document.querySelectorAll('#verfuegGrid .vs-btn.selected')].map(b=>b.dataset.tag);
  await upsertGaertnerProfil({verfuegbarkeit:v});
  gaertnerProfil.verfuegbarkeit=v; closeModal(); showToast('Verfügbarkeit gespeichert ✅'); renderProfil();
}
async function saveWerkzeug() {
  const wz=[...document.querySelectorAll('.wz-tag.selected')].map(b=>b.dataset.label);
  await upsertGaertnerProfil({werkzeuge:wz});
  gaertnerProfil.werkzeuge=wz; closeModal(); showToast('Werkzeug gespeichert ✅'); renderProfil();
}
async function saveErfahrung() {
  const arb=document.getElementById('m_arb').value.trim(), aus=document.getElementById('m_aus').value.trim();
  await upsertGaertnerProfil({arbeitgeber:arb,ausbildung:aus});
  gaertnerProfil.arbeitgeber=arb; gaertnerProfil.ausbildung=aus;
  closeModal(); showToast('Erfahrung gespeichert ✅'); renderProfil();
}
async function saveAuftrag(id) {
  const taetigkeit=document.getElementById('a_taetigkeit').value.trim();
  if(!taetigkeit){showToast('❌ Bitte Tätigkeit wählen!');return;}
  const obj={gaertner_id:currentUser.id,titel:taetigkeit,beschreibung:'',preis:document.getElementById('a_preis').value||null,dauer:document.getElementById('a_dauer').value||null,jahreszeit:document.getElementById('a_js').value||null};
  if(id){
    await sb.from('gaertner_auftraege').update(obj).eq('id',id);
    const idx=auftraege.findIndex(a=>a.id===id); if(idx>=0) auftraege[idx]={...auftraege[idx],...obj};
  } else {
    const {data}=await sb.from('gaertner_auftraege').insert(obj).select().single(); if(data) auftraege.unshift(data);
  }
  closeModal(); showToast('Angebot gespeichert ✅'); renderProfil();
}
async function loescheAuftrag(id) {
  if(!confirm('Angebot löschen?'))return;
  await sb.from('gaertner_auftraege').delete().eq('id',id);
  auftraege=auftraege.filter(a=>a.id!==id); closeModal(); showToast('Gelöscht'); renderProfil();
}
async function saveFarben() {
  await speichereEinstellungen(); closeModal(); showToast('Farben gespeichert ✅');
}
async function speichereAlles() { await speichereEinstellungen(); showToast('✅ Alles gespeichert!'); }
async function speichereEinstellungen() {
  const e=JSON.stringify({farben,blockOrder,layout:currentLayout,btnEinstellungen,hiddenBlocks:[...hiddenBlocks],isOnline});
  await upsertGaertnerProfil({profil_einstellungen:e}); gaertnerProfil.profil_einstellungen=e;
}
async function upsertGaertnerProfil(updates) {
  const {data:ex}=await sb.from('gaertner_profil').select('id').eq('user_id',currentUser.id).single();
  if(ex) await sb.from('gaertner_profil').update(updates).eq('user_id',currentUser.id);
  else await sb.from('gaertner_profil').insert({user_id:currentUser.id,...updates});
  gaertnerProfil={...gaertnerProfil,...updates};
}

// ── KUNDEN AUFTRAG ANNEHMEN ──
async function auftragAnnehmen(id) {
  await sb.from('kunden_auftraege').update({status:'angenommen'}).eq('id',id);
  const idx=kundenAuftraege.findIndex(a=>a.id===id);
  if(idx>=0) kundenAuftraege[idx].status='angenommen';
  showToast('✅ Auftrag angenommen!'); renderProfil();
}

// ── AVATAR ──
function clickAvatar() { if(isOwner) document.getElementById('avatarFileInput').click(); }
async function uploadAvatar(e) {
  const file=e.target.files[0]; if(!file)return;
  if(file.size>2*1024*1024){showToast('❌ Max. 2 MB');return;}
  const ext=file.name.split('.').pop(), path=`avatars/${currentUser.id}.${ext}`;
  const {error}=await sb.storage.from('profile-images').upload(path,file,{upsert:true});
  if(error){showToast('❌ Upload fehlgeschlagen');return;}
  const {data}=sb.storage.from('profile-images').getPublicUrl(path);
  await sb.from('profile').update({avatar_url:data.publicUrl}).eq('id',currentUser.id);
  document.getElementById('avatarImg').src=data.publicUrl+'?t='+Date.now();
  document.getElementById('avatarImg').style.display='block';
  document.getElementById('avatarIcon').style.display='none';
  showToast('Profilbild gespeichert ✅');
}

// ── AKTIONS-BUTTONS ──
let btnEinstellungenLocal = { ...btnEinstellungen };
function updateButtons() {
  const form=document.getElementById('btnForm')?.value||btnEinstellungen.form;
  const stil=document.getElementById('btnStil')?.value||btnEinstellungen.stil;
  const groesse=document.getElementById('btnGroesse')?.value||btnEinstellungen.groesse;
  const c1=document.getElementById('btnColor1')?.value||btnEinstellungen.c1;
  const c2=document.getElementById('btnColor2')?.value||btnEinstellungen.c2;
  const c3=document.getElementById('btnColor3')?.value||btnEinstellungen.c3;
  btnEinstellungen={form,stil,groesse,c1,c2,c3};
  [{id:'btnKontoLoeschen',color:c1},{id:'btnGeld',color:c2},{id:'btnKundenAuftraege',color:c3}].forEach(b=>{
    const el=document.getElementById(b.id); if(!el)return;
    el.className='aktions-btn '+form+(stil==='stil-gefuellt'?'':' '+stil);
    el.style.fontSize=groesse;
    if(stil==='stil-gefuellt'){el.style.background=b.color;el.style.color='#fff';el.style.borderColor=b.color;}
    else if(stil==='stil-outline'){el.style.background='transparent';el.style.color=b.color;el.style.borderColor=b.color;}
    else{el.style.background='transparent';el.style.color=b.color;el.style.borderColor='transparent';}
  });
}
async function kontoLoeschen() {
  if(!confirm('Konto KOMPLETT löschen?\n\nAlle Daten werden unwiderruflich gelöscht.'))return;
  if(!confirm('LETZTE WARNUNG: Endgültig löschen?'))return;
  showToast('⏳ Wird gelöscht...');
  try{await sb.from('gaertner_auftraege').delete().eq('gaertner_id',currentUser.id);await sb.from('gaertner_profil').delete().eq('user_id',currentUser.id);await sb.from('profile').delete().eq('id',currentUser.id);}catch(_){}
  await sb.auth.signOut(); window.location.href='index.html';
}

function auftragAnfragen(id) { if(!currentUser){window.location.href='anmelden.html';return;} window.location.href=`auftrag-erstellen.html?gaertner=${profil.id}${id?'&angebot='+id:''}`; }
function chatOeffnen() { if(!currentUser){window.location.href='anmelden.html';return;} window.location.href=`chat.html?mit=${profil.id}`; }
async function abmelden() { await sb.auth.signOut(); window.location.href='index.html'; }

function showToast(t) {
  const el=document.getElementById('toast'); document.getElementById('toastText').textContent=t;
  el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3000);
}

init();
</script>
